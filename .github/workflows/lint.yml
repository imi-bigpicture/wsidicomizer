name: lint

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Installs ruff and runs `ruff check`; no project install needed.
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
      - name: Ruff format check
        run: ruff format --check

  pyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      # Pyright resolves imports against installed packages, so deps are required.
      - name: Install dependencies
        run: uv sync --all-extras
      # A branch opts in to unreleased dependencies by committing this file.
      - name: Install unreleased dependencies
        if: ${{ hashFiles('.github/unreleased-requirements.txt') != '' }}
        run: uv pip install -r .github/unreleased-requirements.txt
      # --no-sync, as a sync would put back the locked versions.
      - name: Pyright
        run: uv run --no-sync pyright

  typos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Typos
        run: uv run typos wsidicomizer tests README.md CHANGELOG.md

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          # Pinned: `uv audit` is still experimental and may change between releases.
          version: "0.12.6"
      # Audits uv.lock against the OSV database; reads the lockfile directly, so no
      # project install is needed. --locked also asserts uv.lock is up to date.
      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
